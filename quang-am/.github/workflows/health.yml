name: Quang Am - Source Health
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Verify independent story-source links
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe only chapter 614 page metadata, not copyrighted chapter text
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          from urllib.error import URLError
          sources = [
              ("TruyenHay", "https://truyenhay.app/quang-am-chi-ngoai-truyen-chu/chuong-614"),
              ("Việt Nam Thư Quán", "https://vietnamthuquan.eu/TacPham/quang-am-chi-ngoai-26684/chuong-614")
          ]
          report = ["## Quang Âm — kiểm tra nguồn", "", "Đây là kiểm tra từ máy chủ GitHub Actions; kết quả có thể khác mạng và thiết bị của người đọc.", ""]
          healthy = 0
          for name, url in sources:
              try:
                  req = Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; QuangAmHealth/1.0)", "Accept-Encoding":"identity"})
                  with urlopen(req, timeout=15) as response:
                      status = response.status
                      final_path = urlparse(response.geturl()).path.rstrip("/")
                      sample = response.read(12000).decode("utf-8", errors="ignore")
                  valid = status == 200 and final_path.endswith("/chuong-614") and ("Quang Âm Chi Ngoại" in sample or "Quang Am Chi Ngoai" in sample)
                  if valid:
                      healthy += 1
                      report.append(f"- ✅ {name}: trả về chương 614 với tiêu đề nhận diện được")
                  else:
                      report.append(f"- ⚠️ {name}: HTTP {status}; không xác thực được trang chương (có thể gặp chặn bot)")
              except Exception as exc:
                  report.append(f"- ⚠️ {name}: không phản hồi hợp lệ ({type(exc).__name__})")
          summary = "\n".join(report) + "\n"
          print(summary)
          target = os.getenv("GITHUB_STEP_SUMMARY")
          if target:
              with open(target, "a", encoding="utf-8") as f:
                  f.write(summary)
          if healthy == 0:
              print("::warning::Không xác minh được cả hai nguồn từ máy chủ GitHub. Chưa thể kết luận hai nguồn đều ngừng hoạt động.")
              sys.exit(1)
          if healthy < len(sources):
              print("::warning::Có ít nhất một nguồn trả kết quả bất thường. Giữ nguyên nguồn người đọc đã chọn.")
          PY

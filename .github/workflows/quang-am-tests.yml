name: Quang Am - Independent Regression Tests
on:
  push:
    branches: [main, 'feature/quang-am-*']
    paths:
      - 'quang-am/**'
      - '.github/workflows/quang-am-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    name: Reader bookmark & backup tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check quang-am/app.js
          node --check quang-am/sw.js
      - name: Run isolated reader tests
        run: node --test quang-am/tests/*.test.cjs

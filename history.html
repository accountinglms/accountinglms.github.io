<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lịch sử làm bài · ICAEW LMS</title>
<meta name="theme-color" content="#0d2543">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://uangiwgznukuicrfnohq.supabase.co wss://uangiwgznukuicrfnohq.supabase.co; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests">
<link rel="manifest" href="manifest.webmanifest">
<script src="assets/theme-init.js"></script>
<link rel="stylesheet" href="assets/history.css">

<link rel="stylesheet" href="assets/vg-theme.css">
</head>
<body class="page-history">
<main class="page">
  <div class="shell">
    <header class="topbar">
      <div class="headerCopy">
        <div class="eyebrow">Học tập</div>
        <h1>Lịch sử làm bài</h1>
        <p class="subtitle">Xem lại từng lần nộp bài, kết quả và câu trả lời đã chọn để theo dõi tiến bộ theo thời gian.</p>
      </div>
      <div class="topActions">
        <span id="live-status" class="liveBadge" role="status" aria-live="polite">
          <i class="liveDot" aria-hidden="true"></i>
          <span>Đang đồng bộ…</span>
        </span>
        <a class="back" href="home.html">← Trang chủ</a>
      </div>
    </header>

    <section id="app" class="hidden">
      <section class="summaryStrip" aria-label="Tổng quan lịch sử làm bài">
        <div class="metric">
          <span class="metricLabel">Lượt đã nộp</span>
          <strong id="metric-attempts">0</strong>
          <small class="metricNote" id="metric-attempts-note">—</small>
        </div>
        <div class="metric">
          <span class="metricLabel">Điểm tốt nhất</span>
          <strong id="metric-best">—</strong>
          <small class="metricNote" id="metric-best-note">—</small>
        </div>
        <div class="metric">
          <span class="metricLabel">Lần gần nhất</span>
          <strong id="metric-latest">—</strong>
          <small class="metricNote" id="metric-latest-note">—</small>
        </div>
        <div class="metric">
          <span class="metricLabel">Tổng thời gian</span>
          <strong id="metric-time">—</strong>
          <small class="metricNote" id="metric-time-note">—</small>
        </div>
      </section>

      <section id="history-filters" class="filtersPanel" aria-label="Bộ lọc lịch sử">
        <span class="filtersLabel">Bộ lọc</span>
        <div class="toolbar">
          <label class="field" id="filter-subject-field"><span>Môn học</span><select id="filter-subject"></select></label>
          <label class="field" id="filter-chapter-field"><span>Chương</span><select id="filter-chapter"></select></label>
          <label class="field" id="filter-exercise-field"><span>Bài tập</span><select id="filter-exercise"></select></label>
        </div>
      </section>

      <div class="sectionTitle">
        <div class="sectionTitleMain">
          <h2>Các lần làm</h2>
          <small id="result-count">0 lượt làm</small>
        </div>
        <div class="sectionActions">
          <button id="refresh-history" class="refresh" type="button" aria-label="Làm mới lịch sử">
            <span aria-hidden="true">↻</span>
            <span class="refreshLabel">Làm mới</span>
          </button>
        </div>
      </div>
      <section id="timeline" class="timeline" aria-live="polite"></section>
    </section>

    <div id="history-error" class="error hidden"></div>
  </div>
</main>
<script type="module" src="assets/history.js"></script>
</body>
</html>
